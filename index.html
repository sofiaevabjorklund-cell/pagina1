<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz Cartoon Network</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
    body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
    .game-container{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.2);width:100%;max-width:500px;overflow:hidden}
    .header{background:linear-gradient(90deg,#ff6b6b,#feca57);padding:20px;text-align:center}
    .header h1{color:#fff;font-size:1.5rem;text-shadow:2px 2px 4px rgba(0,0,0,.3)}
    .screen{padding:30px 20px;text-align:center;display:none}
    .screen.active{display:block}
    .start-title{font-size:1.4rem;color:#333;margin-bottom:10px}
    .start-sub{color:#6c757d;margin-bottom:25px;line-height:1.5}
    .big-btn{padding:16px 40px;font-size:1.1rem;background:linear-gradient(90deg,#667eea,#764ba2);color:#fff;border:none;border-radius:30px;cursor:pointer;font-weight:bold;box-shadow:0 4px 15px rgba(102,126,234,.4)}
    .big-btn:active{transform:scale(.95)}
    .stats-bar{display:flex;justify-content:space-around;padding:15px;background:#f8f9fa;border-bottom:2px solid #e9ecef}
    .stat-label{font-size:.75rem;color:#6c757d;text-transform:uppercase;letter-spacing:1px}
    .stat-value{font-size:1.2rem;font-weight:bold;color:#333}
    .timer-bar{height:6px;background:#e9ecef}
    .timer-fill{height:100%;width:100%;background:linear-gradient(90deg,#28a745,#20c997);transition:width .1s linear}
    .question-text{font-size:1.15rem;color:#333;margin-bottom:20px;line-height:1.5}
    .options-grid{display:grid;grid-template-columns:1fr;gap:12px}
    .option-btn{padding:16px;font-size:1rem;border:2px solid #e9ecef;border-radius:12px;background:#fff;color:#333;cursor:pointer;font-weight:500;transition:all .2s}
    .option-btn:active{transform:scale(.98)}
    .option-btn.correct{background:#d4edda;border-color:#28a745;color:#155724}
    .option-btn.incorrect{background:#f8d7da;border-color:#dc3545;color:#721c24}
    .option-btn.disabled{pointer-events:none;opacity:.6}
    .feedback{margin-top:20px;font-size:1.1rem;font-weight:bold;margin-bottom:15px}
    .next-btn{padding:14px 30px;font-size:1rem;background:linear-gradient(90deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-weight:bold}
    .next-btn:active{transform:scale(.95)}
    .results-score{font-size:3rem;font-weight:bold;color:#667eea;margin:20px 0}
    .results-message{color:#6c757d;margin-bottom:30px}
    .restart-btn{padding:16px 40px;font-size:1.1rem;background:linear-gradient(90deg,#feca57,#ff6b6b);color:#fff;border:none;border-radius:30px;cursor:pointer;font-weight:bold}
    .restart-btn:active{transform:scale(.95)}
    @media(max-width:480px){
      body{padding:12px}
      .header h1{font-size:1.3rem}
      .question-text{font-size:1.05rem}
      .option-btn{padding:14px;font-size:.95rem}
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header"><h1>🎮 Quiz Cartoon Network</h1></div>

    <!-- Pantalla de inicio -->
    <div class="screen active" id="startScreen">
      <h2 class="start-title">¡Bienvenido al Quiz!</h2>
      <p class="start-sub">10 preguntas de Cartoon Network.<br>Respondé rápido para ganar más puntos.<br>Tenés 3 vidas ❤️❤️❤️</p>
      <button class="big-btn" onclick="startGame()">Iniciar Juego ▶️</button>
    </div>

    <!-- Pantalla de juego -->
    <div class="screen" id="gameScreen">
      <div class="stats-bar">
        <div><div class="stat-label">Pregunta</div><div class="stat-value" id="questionNum">1/10</div></div>
        <div><div class="stat-label">Puntos</div><div class="stat-value" id="score">0</div></div>
        <div><div class="stat-label">Vidas</div><div class="stat-value" id="lives">❤️❤️❤️</div></div>
      </div>
      <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
      <div style="padding:25px 20px">
        <div class="question-text" id="questionText"></div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="feedback" id="feedbackText" style="display:none"></div>
        <button class="next-btn" id="nextBtn" style="display:none" onclick="nextQuestion()">Siguiente ➡️</button>
      </div>
    </div>

    <!-- Pantalla de resultados -->
    <div class="screen" id="resultsScreen">
      <h2>🎉 ¡Juego Terminado!</h2>
      <div class="results-score" id="finalScore">0</div>
      <p class="results-message" id="finalMessage"></p>
      <button class="restart-btn" onclick="showStart()">Volver al Inicio 🔄</button>
    </div>
  </div>

<script>
const questions=[
 {q:"¿Cuál es el nombre del perro en 'Hora de Aventura'?",o:["Jake","Finn","BMO","Starchy"],c:0},
 {q:"¿Qué personaje tiene el Omnitrix?",o:["Ben 10","Chowder","Billy","Johnny Bravo"],c:0},
 {q:"¿En qué ciudad viven las Chicas Superpoderosas?",o:["Ciudad Salto","Ciudad Central","Megaciudad","Ciudad Dibujo"],c:0},
 {q:"¿De qué color es Gumball?",o:["Azul","Rosa","Verde","Amarillo"],c:0},
 {q:"¿Cómo se llama el hermano de Finn?",o:["Jake","BMO","Marceline","Princesa Grumosa"],c:0},
 {q:"¿Quién es el villano de las Chicas Superpoderosas?",o:["Mojo Jojo","Him","Fuzzy","Todos"],c:0},
 {q:"¿Cuál es la frase típica de Johnny Bravo?",o:["¡Hoo-ha!","¡Oh yeah!","¡Cowabunga!","¡Booyah!"],c:1},
 {q:"¿Cómo se llama el laboratorio de Dexter?",o:["Laboratorio de Dexter","Labo-D","DexLab","Super Lab"],c:0},
 {q:"¿Qué animal es Rigby en 'Regular Show'?",o:["Mapache","Zorro","Conejo","Oso"],c:0},
 {q:"¿Cómo se llama el robot azul de 'Hora de Aventura'?",o:["BMO","Jake","Gunter","LSP"],c:0}
];

let current=0,score=0,lives=3,timer,timeLeft;
const MAX_TIME=15;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame(){
  current=0;score=0;lives=3;
  showScreen('gameScreen');
  loadQuestion();
}

function showStart(){showScreen('startScreen');}

function updateStats(){
  document.getElementById('questionNum').textContent=(current+1)+'/'+questions.length;
  document.getElementById('score').textContent=score;
  document.getElementById('lives').textContent='❤️'.repeat(lives)||'💔';
}

function loadQuestion(){
  const q=questions[current];
  document.getElementById('questionText').textContent=q.q;
  document.getElementById('feedbackText').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  const grid=document.getElementById('optionsGrid');
  grid.innerHTML='';
  q.o.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='option-btn';
    b.textContent=opt;
    b.onclick=()=>selectOption(i);
    grid.appendChild(b);
  });
  updateStats();
  startTimer();
}

function startTimer(){
  timeLeft=MAX_TIME;
  updateTimerBar();
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft-=0.1;
    updateTimerBar();
    if(timeLeft<=0){clearInterval(timer);timeOut();}
  },100);
}

function updateTimerBar(){
  const p=Math.max(0,(timeLeft/MAX_TIME)*100);
  const f=document.getElementById('timerFill');
  f.style.width=p+'%';
  f.style.background=p<30?'linear-gradient(90deg,#dc3545,#c82333)':p<60?'linear-gradient(90deg,#ffc107,#ff9800)':'linear-gradient(90deg,#28a745,#20c997)';
}

function timeOut(){
  lockOptions();
  const c=questions[current].c;
  document.querySelectorAll('.option-btn')[c].classList.add('correct');
  lives--;
  updateStats();
  showFeedback(false,'¡Se acabó el tiempo! ⏰');
}

function selectOption(i){
  clearInterval(timer);
  lockOptions();
  const c=questions[current].c;
  const btns=document.querySelectorAll('.option-btn');
  if(i===c){btns[i].classList.add('correct');score+=100+Math.floor(timeLeft*10);showFeedback(true,'¡Correcto! 🎉');}
  else{btns[i].classList.add('incorrect');btns[c].classList.add('correct');lives--;showFeedback(false,'¡Incorrecto! 😢');}
  updateStats();
}

function lockOptions(){
  document.querySelectorAll('.option-btn').forEach(b=>b.classList.add('disabled'));
}

function showFeedback(ok,msg){
  const f=document.getElementById('feedbackText');
  f.textContent=msg;
  f.style.color=ok?'#28a745':'#dc3545';
  f.style.display='block';
  const n=document.getElementById('nextBtn');
  n.style.display='inline-block';
  n.textContent=(lives<=0||current>=questions.length-1)?'Ver resultados 🏁':'Siguiente ➡️';
}

function nextQuestion(){
  current++;
  if(current>=questions.length||lives<=0) showResults();
  else loadQuestion();
}

function showResults(){
  clearInterval(timer);
  showScreen('resultsScreen');
  document.getElementById('finalScore').textContent=score;
  const max=questions.length*(100+MAX_TIME*10);
  const p=(score/max)*100;
  let m;
  if(p>=90)m='¡Excelente! Sos un experto en Cartoon Network 🏆';
  else if(p>=70)m='¡Muy bien! Casi perfecto 🌟';
  else if(p>=50)m='¡Bien hecho! Pero podés mejorar 👍';
  else m='¡Seguí practicando! Vos podés 💪';
  document.getElementById('finalMessage').textContent=m;
}

document.addEventListener('DOMContentLoaded',()=>{showScreen('startScreen');});
</script>
</body>
</html>
