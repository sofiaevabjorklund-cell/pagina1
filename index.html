<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test de Situaciones del Campo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f3f6f9;
      color: #17222b;
      display: flex;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #55636f; }
    .hidden { display: none; }
    .timer {
      font-weight: 700;
      font-size: 20px;
      color: #0b6bcb;
      margin: 12px 0;
    }
    .timer.warning { color: #d1332e; }
    .question { font-size: 20px; font-weight: 600; margin: 18px 0; }
    .options { display: grid; gap: 12px; }
    button {
      width: 100%;
      text-align: left;
      padding: 15px 18px;
      font-size: 16px;
      border: 2px solid #d8e1e8;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      transition: .15s;
    }
    button:hover:not(:disabled) { border-color: #0b6bcb; background: #f2f8ff; }
    button.correct { border-color: #1d9d54; background: #e9f8ef; }
    button.wrong { border-color: #d1332e; background: #fdeeee; }
    button:disabled { cursor: default; }
    .primary {
      background: #0b6bcb;
      color: #fff;
      border: none;
      text-align: center;
      font-weight: 700;
      padding: 14px;
    }
    .progress { color: #66757f; font-size: 14px; }
    .result { font-size: 22px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Test de Situaciones del Campo</h1>
    <p>Respondé 25 situaciones que pueden suceder en el trabajo. Cada una tiene cuatro opciones y solo una es la más segura y correcta.</p>

    <section id="startScreen">
      <button class="primary" id="startBtn">Iniciar juego</button>
    </section>

    <section id="quizScreen" class="hidden">
      <div class="progress" id="progress"></div>
      <div class="timer" id="timer">7 s</div>
      <div class="question" id="questionText"></div>
      <div class="options" id="options"></div>
    </section>

    <section id="endScreen" class="hidden">
      <div class="result" id="resultText"></div>
      <button class="primary" id="restartBtn">Jugar de nuevo</button>
    </section>
  </main>

  <script>
    const TIME_PER_QUESTION = 7;

    // REEMPLAZÁ ESTE ARREGLO POR TUS 25 PREGUNTAS ORIGINALES.
    // Mantené exactamente esta estructura: text y correct.
    const QUESTIONS = [
      {
        question: "Pegá aquí la pregunta 1",
        options: [
          { text: "Opción A", correct: false },
          { text: "Opción B", correct: true },
          { text: "Opción C", correct: false },
          { text: "Opción D", correct: false }
        ]
      }
      // Agregá las 24 preguntas restantes aquí, separadas por comas.
    ];

    const startScreen = document.getElementById("startScreen");
    const quizScreen = document.getElementById("quizScreen");
    const endScreen = document.getElementById("endScreen");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const progress = document.getElementById("progress");
    const timerEl = document.getElementById("timer");
    const questionText = document.getElementById("questionText");
    const optionsEl = document.getElementById("options");
    const resultText = document.getElementById("resultText");

    let currentIndex = 0;
    let score = 0;
    let timeLeft = TIME_PER_QUESTION;
    let timerId = null;
    let answered = false;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startGame() {
      currentIndex = 0;
      score = 0;
      startScreen.classList.add("hidden");
      endScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      const current = QUESTIONS[currentIndex];
      progress.textContent = `Pregunta ${currentIndex + 1} de ${QUESTIONS.length}`;
      questionText.textContent = current.question;

      // Esto aleatoriza las cuatro respuestas en cada pregunta.
      const shuffledOptions = shuffle(current.options);

      optionsEl.innerHTML = "";
      shuffledOptions.forEach(option => {
        const btn = document.createElement("button");
        btn.textContent = option.text;
        btn.addEventListener("click", () => selectAnswer(btn, option.correct));
        optionsEl.appendChild(btn);
      });

      timeLeft = TIME_PER_QUESTION;
      updateTimer();
      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) {
          clearInterval(timerId);
          markCorrectAnswer();
          setTimeout(nextQuestion, 900);
        }
      }, 1000);
    }

    function updateTimer() {
      timerEl.textContent = `${timeLeft} s`;
      timerEl.classList.toggle("warning", timeLeft <= 3);
    }

    function selectAnswer(button, isCorrect) {
      if (answered) return;
      answered = true;
      clearInterval(timerId);

      if (isCorrect) {
        score++;
        button.classList.add("correct");
      } else {
        button.classList.add("wrong");
        markCorrectAnswer();
      }

      disableOptions();
      setTimeout(nextQuestion, 900);
    }

    function markCorrectAnswer() {
      [...optionsEl.children].forEach((btn, index) => {
        const current = QUESTIONS[currentIndex];
        const originalOption = current.options.find(o => o.text === btn.textContent);
        if (originalOption && originalOption.correct) btn.classList.add("correct");
      });
      disableOptions();
    }

    function disableOptions() {
      [...optionsEl.children].forEach(btn => btn.disabled = true);
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < QUESTIONS.length) {
        showQuestion();
      } else {
        endGame();
      }
    }

    function endGame() {
      clearInterval(timerId);
      quizScreen.classList.add("hidden");
      endScreen.classList.remove("hidden");
      resultText.textContent = `Test finalizado. Obtuviste ${score} de ${QUESTIONS.length} respuestas correctas.`;
    }

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);
  </script>
</body>
</html>
