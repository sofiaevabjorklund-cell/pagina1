    <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quiz Cartoon Network</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .game-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, #ff6b6b, #feca57);
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      color: white;
      font-size: 1.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      padding: 15px 20px;
      background: #f8f9fa;
      border-bottom: 2px solid #e9ecef;
    }

    .stat {
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }

    .timer-bar {
      height: 6px;
      background: #e9ecef;
      position: relative;
    }

    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, #28a745, #20c997);
      width: 100%;
      transition: width 0.1s linear;
    }

    .question-area {
      padding: 25px 20px;
      text-align: center;
    }

    .question-text {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .option-btn {
      padding: 16px 20px;
      font-size: 1rem;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      background: white;
      color: #333;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .option-btn:hover {
      background: #f8f9fa;
      border-color: #dee2e6;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-btn.correct {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }

    .option-btn.incorrect {
      background: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }

    .option-btn.disabled {
      pointer-events: none;
      opacity: 0.6;
    }

    .feedback-area {
      padding: 20px;
      text-align: center;
      background: #f8f9fa;
      border-top: 2px solid #e9ecef;
      display: none;
    }

    .feedback-text {
      font-size: 1.1rem;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .next-btn {
      padding: 14px 30px;
      font-size: 1rem;
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }

    .next-btn:active {
      transform: scale(0.95);
    }

    .results-screen {
      display: none;
      padding: 40px 20px;
      text-align: center;
    }

    .results-title {
      font-size: 1.8rem;
      color: #333;
      margin-bottom: 10px;
    }

    .results-score {
      font-size: 3rem;
      font-weight: bold;
      color: #667eea;
      margin: 20px 0;
    }

    .results-message {
      font-size: 1.1rem;
      color: #6c757d;
      margin-bottom: 30px;
    }

    .restart-btn {
      padding: 16px 40px;
      font-size: 1.1rem;
      background: linear-gradient(90deg, #feca57, #ff6b6b);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(254, 202, 87, 0.4);
    }

    .restart-btn:active {
      transform: scale(0.95);
    }

    /* Mobile optimizations */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .header h1 {
        font-size: 1.3rem;
      }

      .question-text {
        font-size: 1.1rem;
      }

      .option-btn {
        padding: 14px 16px;
        font-size: 0.95rem;
      }

      .stat-value {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <h1>🎮 Quiz Cartoon Network</h1>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-label">Pregunta</div>
        <div class="stat-value" id="questionNum">1/10</div>
      </div>
      <div class="stat">
        <div class="stat-label">Puntos</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Vidas</div>
        <div class="stat-value" id="lives">❤️❤️❤️</div>
      </div>
    </div>

    <div class="timer-bar">
      <div class="timer-fill" id="timerFill"></div>
    </div>

    <div class="question-area" id="questionArea">
      <div class="question-text" id="questionText">Cargando pregunta...</div>
      <div class="options-grid" id="optionsGrid">
        <button class="option-btn" onclick="selectOption(0)">Opción 1</button>
        <button class="option-btn" onclick="selectOption(1)">Opción 2</button>
        <button class="option-btn" onclick="selectOption(2)">Opción 3</button>
        <button class="option-btn" onclick="selectOption(3)">Opción 4</button>
      </div>
    </div>

    <div class="feedback-area" id="feedbackArea">
      <div class="feedback-text" id="feedbackText">¡Correcto!</div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Siguiente ➡️</button>
    </div>

    <div class="results-screen" id="resultsScreen">
      <h2 class="results-title">🎉 ¡Juego Terminado!</h2>
      <div class="results-score" id="finalScore">0</div>
      <div class="results-message" id="finalMessage">Veamos cómo te fue...</div>
      <button class="restart-btn" onclick="restartGame()">Jugar de Nuevo 🔄</button>
    </div>
  </div>

      },
      {

        options: ["Ciudad Salto", "Ciudad Central", "Megaciudad", "Ciudad Dibujo"],

      },

      },

      {

        correct: 0
      },
      {
        question: "¿Qué comen las vacas en 'Las Vacas'?",
        options: ["Todo", "Pasto", "Hamburguesas", "Pizza"],
        correct: 0
      },
      {
        question: "¿Cómo se llama el laboratorio de Dexter?",
        options: ["Laboratorio de Dexter", "Labo-D", "DexLab", "Super Lab"],
        correct: 0
      },
      {
        question: "¿Qué forma tiene la cabeza de Ed, Edd y Eddy?",
        options: ["Cada uno es diferente", "Redonda", "Cuadrada", "Triangular"],
        correct: 0
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let lives = 3;
    let timer;
    let timeLeft;
    const maxTime = 15; // segundos por pregunta

    function initGame() {
      currentQuestion = 0;
      score = 0;
      lives = 3;
      updateStats();
      loadQuestion();
      document.getElementById('resultsScreen').style.display = 'none';
      document.getElementById('questionArea').style.display = 'block';
    }

    function updateStats() {
      document.getElementById('questionNum').textContent = `${currentQuestion + 1}/${questions.length}`;
      document.getElementById('score').textContent = score;
      document.getElementById('lives').textContent = '❤️'.repeat(lives);
    }

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('questionText').textContent = q.question;

      const optionsGrid = document.getElementById('optionsGrid');
      optionsGrid.innerHTML = '';

      q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => selectOption(index);
        optionsGrid.appendChild(btn);
      });

      document.getElementById('feedbackArea').style.display = 'none';
      startTimer();
    }

    function startTimer() {
      timeLeft = maxTime;
      updateTimerBar();

      timer = setInterval(() => {
        timeLeft -= 0.1;
        updateTimerBar();

        if (timeLeft <= 0) {
          clearInterval(timer);
          timeOut();
        }
      }, 100);
    }

    function updateTimerBar() {
      const percentage = (timeLeft / maxTime) * 100;
      const timerFill = document.getElementById('timerFill');
      timerFill.style.width = percentage + '%';

      if (percentage < 30) {
        timerFill.style.background = 'linear-gradient(90deg, #dc3545, #c82333)';
      } else if (percentage < 60) {
        timerFill.style.background = 'linear-gradient(90deg, #ffc107, #ff9800)';
      } else {
        timerFill.style.background = 'linear-gradient(90deg, #28a745, #20c997)';
      }
    }

</html>
