<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de Situaciones del Campo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(160deg,#0b3d2e,#14532d,#166534);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:20px;padding:28px;max-width:720px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35)}
h1{font-size:26px;margin-bottom:8px}
p{opacity:.9;line-height:1.5}
button{width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:bold;cursor:pointer;background:#facc15;color:#1f2937;margin-top:18px;transition:.2s}
button:hover{transform:translateY(-2px)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.option{display:block;width:100%;text-align:left;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:14px;padding:14px;margin-top:10px;font-size:16px;cursor:pointer}
.option:hover:not(:disabled){background:rgba(255,255,255,.2)}
.option.correct{background:#16a34a;border-color:#22c55e}
.option.wrong{background:#dc2626;border-color:#ef4444}
.option:disabled{cursor:not-allowed;opacity:.85}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-weight:bold}
.timer{background:rgba(0,0,0,.25);padding:8px 14px;border-radius:999px}
.timer.low{background:#dc2626}
.hidden{display:none}
.feedback{margin-top:14px;padding:12px;border-radius:12px;background:rgba(0,0,0,.25)}
.progress{height:8px;background:rgba(255,255,255,.15);border-radius:999px;margin-bottom:18px;overflow:hidden}
.progress div{height:100%;background:#facc15;width:0;transition:.3s}
</style>
</head>
<body>
<div class="card">
  <section id="start">
    <h1>🌾 Test de Situaciones del Campo</h1>
    <p>Respondé 25 situaciones que pueden suceder en el trabajo. Cada una tiene cuatro opciones y solo una es la más segura y correcta.</p>
    <button id="startBtn">Iniciar juego</button>
    <p id="loadMsg" class="hidden" style="margin-top:12px"></p>
  </section>

  <section id="quiz" class="hidden">
    <div class="top">
      <span id="counter">Pregunta 1 de 25</span>
      <span id="timer" class="timer">5 s</span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <h2 id="question"></h2>
    <div id="options"></div>
    <div id="feedback" class="feedback hidden"></div>
  </section>

  <section id="end" class="hidden">
    <h1>✅ Test finalizado</h1>
    <p id="result"></p>
    <button id="restartBtn">Jugar de nuevo</button>
  </section>
</div>

<script>
const QUESTIONS_FALLBACK = [{"nivel": "Básico", "tiempo": 30, "q": "Te asignan una máquina que nunca operaste.", "o": ["Pido capacitación y autorización antes de operarla.", "Pruebo los controles mientras avanzo.", "Empiezo a trabajar para no retrasar al equipo.", "Le pido a un compañero que la opere por mí."], "c": 0, "explicacion": "Nunca se debe operar un equipo sin capacitación y autorización."}, {"nivel": "Básico", "tiempo": 30, "q": "Ves un charco de aceite cerca de la zona de trabajo.", "o": ["Lo señalizó y aviso al responsable.", "Lo tapo con tierra y sigo trabajando.", "Lo ignoro porque no es mi tarea.", "Espero a que alguien más lo vea."], "c": 0, "explicacion": "Los derrames deben señalizarse y reportarse para evitar caídas o incendios."}, {"nivel": "Básico", "tiempo": 30, "q": "El casco de seguridad está rajado.", "o": ["Lo reemplazo antes de comenzar.", "Lo uso igual, solo tiene una rajadura.", "Lo presto a otro compañero.", "Lo guardo para usarlo otro día."], "c": 0, "explicacion": "Un EPP dañado no protege y debe reemplazarse."}, {"nivel": "Básico", "tiempo": 30, "q": "Debes levantar una carga pesada sola.", "o": ["Pido ayuda o uso elementos de izaje.", "La levanto rápido con la espalda recta.", "La arrastro hasta el lugar.", "La levanto aunque me cueste."], "c": 0, "explicacion": "Las cargas pesadas requieren ayuda mecánica o trabajo en equipo."}, {"nivel": "Básico", "tiempo": 30, "q": "No encuentras tus guantes de trabajo.", "o": ["Aviso y consigo un par adecuado.", "Trabajo sin guantes por un rato.", "Uso guantes de otra tarea aunque no sirvan.", "Termino la tarea y después los busco."], "c": 0, "explicacion": "Los EPP deben estar completos y adecuados antes de iniciar."}, {"nivel": "Básico", "tiempo": 30, "q": "Un compañero no usa protección auditiva en una zona ruidosa.", "o": ["Le recuerdo usarla y aviso si persiste.", "No digo nada para no molestar.", "Le presto mis tapones cuando termine.", "Sigo trabajando y lo ignoro."], "c": 0, "explicacion": "La protección auditiva es obligatoria en zonas ruidosas."}, {"nivel": "Básico", "tiempo": 30, "q": "Ves que una herramienta eléctrica tiene el cable pelado.", "o": ["La saco de servicio y la reporto.", "La uso con cuidado.", "La cinto con cinta y sigo.", "La dejo conectada para otro turno."], "c": 0, "explicacion": "Un cable dañado puede causar electrocución; debe retirarse de servicio."}, {"nivel": "Básico", "tiempo": 30, "q": "Comienza a llover fuerte mientras trabajás al aire libre.", "o": ["Me pongo a resguardo y sigo las indicaciones.", "Sigo trabajando más rápido.", "Me refugio bajo un árbol.", "Espero debajo de una máquina."], "c": 0, "explicacion": "Hay que buscar refugio seguro; los árboles y maquinaria pueden ser peligrosos."}, {"nivel": "Intermedio", "tiempo": 40, "q": "Un tractor comienza a hacer un ruido extraño durante la tarea.", "o": ["Lo detengo en forma segura y aviso a mantenimiento.", "Sigo hasta terminar la jornada.", "Aumento la velocidad para ver si se acomoda.", "Bajo del tractor mientras está en movimiento."], "c": 0, "explicacion": "Una falla mecánica debe atenderse deteniendo el equipo de forma segura."}, {"nivel": "Intermedio", "tiempo": 40, "q": "Debés reparar una máquina y otro compañero intenta encenderla.", "o": ["Aplico bloqueo y etiquetado antes de intervenir.", "Le pido que espere sin más.", "Trabajo rápido antes de que la encienda.", "Dejo la llave puesta para avisarle."], "c": 0, "explicacion": "El bloqueo y etiquetado evita arranques accidentales durante reparaciones."}, {"nivel": "Intermedio", "tiempo": 40, "q": "Hay mucho polvo y la visibilidad disminuye en el camino rural.", "o": ["Reduzco la velocidad y uso luces si corresponde.", "Mantengo la misma velocidad.", "Adelanto a otro vehículo rápido.", "Detengo el vehículo en la curva."], "c": 0, "explicacion": "Con baja visibilidad hay que reducir velocidad, aumentar distancia y evitar maniobras riesgosas."}, {"nivel": "Intermedio", "tiempo": 40, "q": "Un compañero sufre un corte en la mano.", "o": ["Activo el protocolo de primeros auxilios y aviso.", "Le digo que se lave la mano y siga.", "Espero a ver si corta mucho.", "Le presto mi guante para tapar la herida."], "c": 0, "explicacion": "Ante una lesión se debe activar el protocolo, atender y reportar."}, {"nivel": "Intermedio", "tiempo": 40, "q": "El tanque de combustible comienza a perder líquido cerca de una fuente de calor.", "o": ["Detengo la actividad, alejo fuentes de ignición y aviso.", "Sigo trabajando con cuidado.", "Enciendo una luz para ver mejor.", "Tapo la fuga con un trapo."], "c": 0, "explicacion": "Los derrames de combustible requieren retirar fuentes de ignición y reporte inmediato."}, {"nivel": "Intermedio", "tiempo": 40, "q": "Debés trabajar cerca de un zanjón profundo.", "o": ["Verifico señalización, barandas y permiso necesario.", "Me acerco al borde para ver mejor.", "Trabajo rápido para terminar antes.", "Bajo al zanjón si es más corto."], "c": 0, "explicacion": "Las excavaciones requieren protección contra caídas y evaluación previa."}, {"nivel": "Intermedio", "tiempo": 40, "q": "Un animal se acerca de forma impredecible en el corral.", "o": ["Mantengo distancia y sigo el protocolo de manejo.", "Lo agarro para controlarlo.", "Le grito y corro hacia él.", "Me pongo entre el animal y la salida."], "c": 0, "explicacion": "Con animales hay que mantener distancia, rutas de escape y protocolos de manejo."}, {"nivel": "Intermedio", "tiempo": 40, "q": "El clima anuncia tormenta eléctrica mientras operás maquinaria.", "o": ["Suspendo la tarea y busco refugio seguro.", "Sigo hasta que empiece a llover.", "Me quedo en la cabina abierta.", "Acelero para terminar antes."], "c": 0, "explicacion": "Ante tormenta eléctrica se debe suspender y refugiarse en lugar seguro."}, {"nivel": "Intermedio", "tiempo": 40, "q": "Ves que un compañero usa el teléfono mientras maneja un vehículo de trabajo.", "o": ["Le pido que se detenga y se concentre en manejar.", "No digo nada, es su responsabilidad.", "Le aviso cuando lleguemos.", "Tomo una foto para reportarlo después."], "c": 0, "explicacion": "El uso del teléfono al conducir es una distracción grave y debe corregirse de inmediato."}, {"nivel": "Intermedio", "tiempo": 40, "q": "La escalera que vas a usar tiene un peldaño flojo.", "o": ["No la uso y solicito una escalera en buen estado.", "La uso sosteniéndome bien.", "La reparo mientras estoy subido.", "La presto igual a otro compañero."], "c": 0, "explicacion": "Una escalera defectuosa debe retirarse de servicio."}, {"nivel": "Avanzado", "tiempo": 50, "q": "Durante la cosecha, una máquina se atasca y hay presión por avanzar.", "o": ["Detengo la máquina, bloqueo la energía y sigo el procedimiento.", "Meto la mano para destrabarla rápido.", "Pido a otro que la encienda mientras la reviso.", "Sigo operando para ver si se suelta."], "c": 0, "explicacion": "Nunca se interviene en una máquina en movimiento; primero se detiene y bloquea."}, {"nivel": "Avanzado", "tiempo": 50, "q": "Hay un derrame químico y el viento empuja el vapor hacia el equipo.", "o": ["Evacuo según el protocolo, me protejo y aviso.", "Me acerco para identificar el producto.", "Sigo trabajando con mascarilla común.", "Lavo el derrame con agua sin más."], "c": 0, "explicacion": "Ante productos químicos se debe evacuar, protegerse y activar el protocolo correspondiente."}, {"nivel": "Avanzado", "tiempo": 50, "q": "Un compañero queda atrapado parcialmente por maquinaria.", "o": ["Corto la energía, activo emergencia y no lo muevo innecesariamente.", "Lo saco tirando con fuerza.", "Espero a que llegue el supervisor sin hacer nada.", "Enciendo la máquina para liberarlo."], "c": 0, "explicacion": "Primero se corta la energía y se activa la emergencia; mover a la víctima puede agravar lesiones."}, {"nivel": "Avanzado", "tiempo": 50, "q": "El supervisor pide terminar una tarea que requiere un permiso de trabajo que aún no está aprobado.", "o": ["Explico que no puedo iniciar sin el permiso aprobado.", "Empiezo porque hay presión de tiempo.", "Pido a otro que firme por mí.", "Hago la tarea sin avisar a nadie."], "c": 0, "explicacion": "Los permisos de trabajo son obligatorios; la presión no justifica omitirlos."}, {"nivel": "Avanzado", "tiempo": 50, "q": "Detectás una fuga de gas y hay personas cerca.", "o": ["Activo la alarma, evacuo la zona y aviso al responsable.", "Busco la fuga con un encendedor.", "Abro ventanas y sigo trabajando.", "Espero a que el olor desaparezca."], "c": 0, "explicacion": "Ante gas se debe evacuar, evitar fuentes de ignición y activar la alarma."}, {"nivel": "Avanzado", "tiempo": 50, "q": "Un incendio pequeño comienza cerca de materiales combustibles.", "o": ["Activo la alarma y uso el extintor solo si estoy capacitado y es seguro.", "Intento apagarlo con agua sin evaluar.", "Lo ignoro porque es pequeño.", "Corro a buscar ayuda sin avisar a nadie."], "c": 0, "explicacion": "Se activa la alarma y solo se combate un incendio inicial si hay capacitación y seguridad."}, {"nivel": "Avanzado", "tiempo": 50, "q": "Debés cumplir un plazo, pero el procedimiento seguro requiere más tiempo.", "o": ["Comunico el riesgo y ajusto el plan con el supervisor.", "Salto pasos del procedimiento.", "Pido a compañeros que trabajen más rápido sin protección.", "Hago la tarea igual pero sin reportarlo."], "c": 0, "explicacion": "La seguridad nunca se negocia; los riesgos deben comunicarse y planificarse."}];
let questions = [];
let current = 0;
let score = 0;
let timeLeft = 30;
let timerId = null;
let locked = false;

const $ = id => document.getElementById(id);
const startScreen=$("start"), quizScreen=$("quiz"), endScreen=$("end");
const startBtn=$("startBtn"), loadMsg=$("loadMsg");
const counter=$("counter"), timerEl=$("timer"), questionEl=$("question");
const optionsEl=$("options"), feedbackEl=$("feedback"), bar=$("bar");

function normalize(list){
  return (list||[]).map((q,i)=>({
    q:q.q||q.pregunta||"",
    o:q.o||q.opciones||[],
    c:typeof q.c==="number"?q.c:(q.correcta!==undefined?Number(q.correcta):0),
    tiempo:q.tiempo||q.tiempo||30,
    explicacion:q.explicacion||""
  })).filter(q=>q.q&&Array.isArray(q.o)&&q.o.length===4&&q.c>=0&&q.c<4);
}

async function loadQuestions(){
  startBtn.disabled = true;
  try{
    const res = await fetch("preguntas.json", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.preguntas || data.situaciones || []);
    questions = normalize(list);
    if(!questions.length) throw new Error("JSON vacío");
  }catch(e){
    questions = normalize(QUESTIONS_FALLBACK);
    loadMsg.classList.remove("hidden");
    loadMsg.textContent = "No se pudo leer preguntas.json; se usó la copia incluida. Verificá que ambos archivos estén en la misma carpeta del repositorio.";
  }
  startBtn.disabled = false;
}

function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880; gain.gain.value=.08;
    osc.start(); setTimeout(()=>{osc.stop();ctx.close();},180);
  }catch(e){}
}

function startGame(){
  questions = shuffle(questions);
  current=0; score=0;
  startScreen.classList.add("hidden");
  endScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  showQuestion();
}

function showQuestion(){
  locked=false;
  feedbackEl.classList.add("hidden");
  feedbackEl.innerHTML="";
  const q=questions[current];
  counter.textContent=`Pregunta ${current+1} de ${questions.length}`;
  bar.style.width=`${(current/questions.length)*100}%`;
  questionEl.textContent=q.q;
  optionsEl.innerHTML="";
  q.o.forEach((text,i)=>{
    const b=document.createElement("button");
    b.className="option"; b.textContent=text;
    b.onclick=()=>answer(i,b);
    optionsEl.appendChild(b);
  });
  timeLeft=q.tiempo||30;
  timerEl.textContent=timeLeft+" s";
  timerEl.classList.remove("low");
  clearInterval(timerId);
  timerId=setInterval(()=>{
    timeLeft--;
    timerEl.textContent=timeLeft+" s";
    if(timeLeft<=5){timerEl.classList.add("low");beep();}
    if(timeLeft<=0){clearInterval(timerId);answer(-1,null);}
  },1000);
}

function answer(i,btn){
  if(locked)return;
  locked=true;
  clearInterval(timerId);
  const q=questions[current];
  const buttons=[...optionsEl.children];
  buttons.forEach((b,idx)=>{
    b.disabled=true;
    if(idx===q.c)b.classList.add("correct");
    else if(idx===i)b.classList.add("wrong");
  });
  if(i===q.c)score++;
  feedbackEl.classList.remove("hidden");
  feedbackEl.innerHTML=(i===q.c
    ? "<strong>✅ Correcto.</strong> "
    : (i===-1 ? "<strong>⏱️ Tiempo agotado.</strong> " : "<strong>❌ Incorrecto.</strong> "))
    + (q.explicacion||"");
  setTimeout(()=>{
    current++;
    if(current<questions.length)showQuestion();
    else finish();
  },2200);
}

function finish(){
  quizScreen.classList.add("hidden");
  endScreen.classList.remove("hidden");
  const pct=Math.round(score/questions.length*100);
  $("result").textContent=`Obtuviste ${score} de ${questions.length} respuestas correctas (${pct}%).`;
}

startBtn.onclick=startGame;
$("restartBtn").onclick=()=>{endScreen.classList.add("hidden");startScreen.classList.remove("hidden");};
loadQuestions();
</script>
</body>
</html>
